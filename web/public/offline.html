<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f1524" />
    <title>PulseCast — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(circle at 20% 20%, rgba(34, 211, 238, 0.14), transparent 45%), #070a12;
        color: #f1f5f9;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 420px;
        width: 100%;
        padding: 28px;
        border-radius: 22px;
        background: #0f1524;
        border: 1px solid rgba(148, 163, 184, 0.18);
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        margin-bottom: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 20px;
        color: #94a3b8;
        line-height: 1.5;
        font-size: 0.95rem;
      }
      button {
        border: 0;
        border-radius: 12px;
        padding: 11px 20px;
        background: linear-gradient(135deg, #22d3ee, #8b5cf6);
        color: #070a12;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/icons/icon-192.png" alt="PulseCast icon" />
      <h1>You're offline</h1>
      <p>
        PulseCast needs an active internet connection to sync live videos, chats, and calls with Firebase.
      </p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
